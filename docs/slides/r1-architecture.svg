<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 420" width="1380" height="420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="headG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="headO"viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1380" height="420" fill="#ffffff"/>

  <!-- connectors (drawn first so boxes and labels sit on top) -->
  <!-- arrowheads point at the clients and at the server; the label sits on the line -->
  <g fill="none" stroke="#1d4ed8" stroke-width="4" marker-start="url(#head)">
    <path d="M300,82 H390 V153"/>
    <path d="M300,228 H390 V203"/>
    <path d="M500,178 H470"/>
  </g>
  <path d="M960,258 H1020 V155 H1090" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="10 6" marker-start="url(#headO)" marker-end="url(#headO)"/>

  <!-- clients -->
  <g>
    <rect x="20" y="20" width="280" height="125" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="160" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Client 1</text>
    <text x="160" y="88" text-anchor="middle" font-size="19" fill="#111827">Computer B</text>
    <text x="160" y="118" text-anchor="middle" font-size="17" fill="#374151">Browser + React app</text>

    <rect x="20" y="165" width="280" height="125" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="160" y="203" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Client 2</text>
    <text x="160" y="233" text-anchor="middle" font-size="19" fill="#111827">Computer C</text>
    <text x="160" y="263" text-anchor="middle" font-size="17" fill="#374151">Browser + React app</text>
  </g>

  <!-- WebSocket label -->
  <g>
    <rect x="310" y="153" width="160" height="50" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="390" y="175" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">WebSocket / TCP</text>
    <text x="390" y="195" text-anchor="middle" font-size="15" fill="#374151">JSON chat messages</text>
  </g>

  <!-- server -->
  <g>
    <rect x="500" y="20" width="460" height="270" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
    <text x="730" y="55" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Server: Computer A</text>
    <text x="730" y="78" text-anchor="middle" font-size="16" fill="#374151">Go program, port 8080</text>

    <rect x="520" y="88" width="420" height="40" rx="9" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="730" y="115" text-anchor="middle" font-size="18" fill="#111827">HTTP: serves the web app + stickers</text>

    <!-- /ws: two goroutines per connected client -->
    <rect x="520" y="136" width="420" height="92" rx="9" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="730" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">/ws WebSocket: 2 loops per client</text>
    <rect x="532" y="166" width="192" height="52" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
    <text x="628" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">readPump</text>
    <text x="628" y="208" text-anchor="middle" font-size="15" fill="#374151">socket → Hub</text>
    <rect x="736" y="166" width="192" height="52" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
    <text x="832" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">writePump</text>
    <text x="832" y="208" text-anchor="middle" font-size="15" fill="#374151">Hub → socket</text>

    <!-- readPump feeds the Hub, the Hub feeds writePump -->
    <path d="M628,218 V236" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#headG)"/>
    <path d="M832,236 V218" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#headG)"/>

    <rect x="520" y="236" width="420" height="44" rx="9" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="730" y="265" text-anchor="middle" font-size="18" fill="#111827">Hub: names, DMs, groups, privacy</text>
  </g>

  <!-- cloud AI -->
  <g>
    <rect x="1090" y="100" width="270" height="110" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
    <text x="1225" y="138" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">AI provider</text>
    <text x="1225" y="168" text-anchor="middle" font-size="18" fill="#111827">Google Gemini API</text>
    <text x="1225" y="193" text-anchor="middle" font-size="16" fill="#374151">cloud, over the Internet</text>
    <text x="1035" y="259" font-size="17" font-weight="700" fill="#b45309">HTTPS (TLS) / TCP</text>
    <text x="1035" y="280" font-size="15" fill="#374151">AI summary request</text>
  </g>

  <!-- network layers -->
  <g>
    <rect x="20" y="318" width="940" height="82" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="490" y="351" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Same local network: Wi-Fi / Ethernet, IPv4, DHCP, ARP</text>
    <text x="490" y="381" text-anchor="middle" font-size="17" fill="#374151">Each client opens http://&lt;Computer A IP&gt;:8080</text>

    <rect x="1000" y="318" width="360" height="82" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="1180" y="351" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Internet + DNS</text>
    <text x="1180" y="381" text-anchor="middle" font-size="17" fill="#374151">finds the AI provider's address</text>
  </g>
</svg>
